[alembic]
# path to migration scripts
script_location = app/migrations

# database url (overridden by env.py from app config)
sqlalchemy.url = sqlite:///app/data/finora.db

# version location
version_locations = app/migrations/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value or "zoneinfo" object.
# timezone = utc

# max length of characters to apply to the
# "version code" column
# version_code_size = 32

# The format string to use for version codes.
# version_code_format = "%%s_%%(version_code)s"

# The template used to generate migration files
# template = %(rev)s_ %(slug)s

# The template used to generate migration files in the versions directory.
# file_template = %%(rev)s_ %%(slug)s

# sqlite specific settings
# render_as_batch = true

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory.
# sourceless = false

# version path separator
# version_path_separator = os.path.sep

# The default encoding used when reading Python files.
# source_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
