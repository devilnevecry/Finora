{% extends "base.html" %}

{% block title %}Бюджеты — Finora{% endblock %}

{% block content %}
<section class="section-header">
  <div>
    <h1 class="section-title" data-i18n="nav.budgets">Бюджеты</h1>
    <p class="section-sub">Лимиты расходов по периодам и категориям.</p>
  </div>
  <button class="btn btn-primary btn-sm" id="btn-add-budget" data-i18n="budget.add">Добавить бюджет</button>
</section>

<div class="card">
  <div class="form-field" style="max-width:300px; margin-bottom:1rem;">
    <label data-i18n="common.category">Категория</label>
    <select id="budget-cat-filter"><option value="" data-i18n="common.no_data">Все</option><option value="__overall__" data-i18n="report.account_overview">Общий бюджет</option></select>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-i18n="common.category">Категория</th>
          <th>Период</th>
          <th data-i18n="budget.limit">Лимит</th>
          <th data-i18n="common.amount">Фактически</th>
          <th data-i18n="budget.remaining">Остаток</th>
          <th data-i18n="budget.progress">Выполнение</th>
          <th style="width:130px" data-i18n="common.action">Действия</th>
        </tr>
      </thead>
      <tbody id="budgets-tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="bud-modal-backdrop"></div>
<div class="modal" id="bud-modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <button class="modal-close" id="bud-modal-close" aria-label="Закрыть">✕</button>
    <div class="modal-body" id="bud-modal-body"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (async function(){
    const API = "/api/budgets";
    const CAT_API = "/api/categories";
    let catFilter = "";
    const tbody = document.getElementById("budgets-tbody");
    const catSel = document.getElementById("budget-cat-filter");

    async function loadCats(){
      const res = await window.apiFetch(CAT_API + "?type=expense&include_archived=false");
      const cats = await res.json();
      catSel.innerHTML = '<option value="" data-i18n="common.no_data">Все</option><option value="__overall__" data-i18n="report.account_overview">Общий бюджет</option>' + cats.map(c => `<option value="${c.id}">${escape(c.name)}</option>`).join("");
      window.i18n.translateRoot(catSel);
    }

    async function load(){
      const res = await window.apiFetch(API + "?category_id=" + (catFilter || ""));
      const budgets = await res.json();
      // compute progress per budget via progress endpoint
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth()+1, 0);
      tbody.innerHTML = "";
      for (const b of budgets) {
        const pres = await window.apiFetch(API + "/progress?category_id=" + (b.category_id||"") + "&period_start=" + b.period_start + "&period_end=" + b.period_end);
        const prog = await pres.json();
        const pct = Math.min(100, Math.max(0, prog.percent));
        const over = prog.overspent;
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escape(b.category_id ? (await catName(b.category_id)) : "Общий")}</td>
          <td>${escape(b.period_start)} — ${escape(b.period_end)}</td>
          <td>${formatCurrency(b.amount_limit_minor)}</td>
          <td>${formatCurrency(prog.actual_minor)}</td>
          <td class="${over?'neg':'pos'}">${formatCurrency(prog.remaining_minor)}</td>
          <td>
            <div style="height:6px; background:var(--color-bg-alt); border-radius:3px; overflow:hidden; font-size:0;">
              <div style="height:100%; width:${pct}%; background:${over?'var(--color-danger)':'var(--color-brand)'};"></div>
            </div>
            <div style="font-size:0.78rem; margin-top:2px; color:var(--color-text-muted)">${pct.toFixed(0)}% ${over ? '<span style="color:var(--color-danger)" data-i18n="budget.overspent">Превышен</span>' : ''}</div>
          </td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="app.delBud(${b.id})" data-i18n="common.delete">Удал.</button>
          </td>
        `;
        tbody.appendChild(row);
      }
    }

    async function catName(id){
      const res = await window.apiFetch(CAT_API + "/" + id);
      const c = await res.json();
      return c.name || id;
    }

    window.app = {
      delBud: async function(id){
        if(!confirm("Удалить бюджет?")) return;
        const res = await window.apiFetch(API + "/" + id, { method:"DELETE" });
        if(res.ok){ window.showSuccess({message:"Удалено"}); load(); }
        else window.showError({message:"Ошибка"});
      },
    };

    function openForm(){
      const body = document.getElementById("bud-modal-body");
      body.innerHTML = `
        <form id="bud-form">
          <div class="form-field"><label data-i18n="common.category">Категория</label><select name="category_id"><option value="" data-i18n="common.no_data">Общий бюджет</option></select></div>
          <div class="form-field"><label>Начало периода</label><input type="date" name="period_start" required></div>
          <div class="form-field"><label>Конец периода</label><input type="date" name="period_end" required></div>
          <div class="form-field"><label data-i18n="budget.limit">Лимит</label><input type="text" name="amount_limit" required data-i18n-placeholder="common.amount"></div>
          <div style="display:flex; gap:0.5rem; margin-top:1rem;">
            <button type="button" class="btn btn-secondary" id="bud-form-cancel" data-i18n="common.cancel">Отмена</button>
            <button type="submit" class="btn btn-primary" data-i18n="common.save">Сохранить</button>
          </div>
        </form>
      `;
      document.getElementById("bud-modal").classList.add("open");
      document.getElementById("bud-modal-backdrop").classList.add("open");
      document.getElementById("bud-modal-close").onclick = closeForm;
      document.getElementById("bud-modal-backdrop").onclick = closeForm;
      const csel = document.querySelector("select[name='category_id']");
      fetch(CAT_API + "?type=expense&include_archived=false").then(r=>r.json()).then(cats=>{
        csel.innerHTML = '<option value="" data-i18n="common.no_data">Общий бюджет</option>' + cats.map(c => `<option value="${c.id}">${escape(c.name)}</option>`).join("");
      });
      document.getElementById("bud-form").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(document.getElementById("bud-form"));
        const res = await window.apiFetch(API, { method:"POST", body: fd });
        const r = await res.json();
        if(res.ok){ closeForm(); window.showSuccess({message:"Сохранено"}); load(); }
        else window.showError({message: r.error || "Ошибка"});
      };
    }
    function closeForm(){ document.getElementById("bud-modal").classList.remove("open"); document.getElementById("bud-modal-backdrop").classList.remove("open"); }
    document.getElementById("btn-add-budget").onclick = openForm;
    document.getElementById("budget-cat-filter").onchange = (e) => { catFilter = e.target.value; load(); };
    function formatCurrency(minor){ const u=Number(minor)/100; const abs=Math.abs(u).toLocaleString(window.i18n.lang==="ru"?"ru-RU":"en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); const s=u<0?"\u2212":""; return window.i18n.lang==="ru"?`${abs} $`:`${s}$${abs}`; }
    function escape(s){ const d=document.createElement("div"); d.textContent=s===null||s===undefined?"":s; return d.innerHTML; }
    loadCats(); load();
  })();
</script>
{% endblock %}
